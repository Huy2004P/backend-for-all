[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "backend-for-all"
version = "0.1.0"
description = "Backend for All (BFA) - Open-source, language-independent, and system-independent backend platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "To be determined" }
authors = [
    { name = "Backend for All Contributors" }
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
bfa = "bfa.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bfa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
